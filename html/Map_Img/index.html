<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map-Img</title>
  </head>
  <body>
    <img
      src="https://images.unsplash.com/photo-1630442923896-244dd3717b35"
      alt="Img of Laptop and Mobile"
      height="auto"
      width="80%"
      usemap="#things"
      style="text-align: center"
    />
    <map name="things">
      <area
        shape="rect"
        coords="67,61,689,617"
        alt="Laptop"
        href="laptop.html"
      />

      <area
        shape="rect"
        coords="830,305,970,741"
        alt="Mobile"
        href="mobile.html"
      />
    </map>
  </body>
</html>
