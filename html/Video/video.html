<!doctype html>
<html>
  <body>
    <button onclick="playPause()">Play/Pause</button>
    <button onclick="makeBig()">Big</button>
    <button onclick="makeSmall()">Small</button>
    <button onclick="makeNormal()">Normal</button>
    <br /><br />
    <video width="640" height="360" id="video1" autoplay muted controls>
      <source
        src="./Video Project.mp4"
        type="video/mp4"
      />
    </video>

    <script>
      var myVideo = document.getElementById("video1");

      function playPause() {
        if (myVideo.paused) myVideo.play();
        else myVideo.pause();
      }

      function makeBig() {
        myVideo.width = 800;
      }

      function makeSmall() {
        myVideo.width = 320;
      }

      function makeNormal() {
        myVideo.width = 640;
      }
    </script>
  </body>
</html>
