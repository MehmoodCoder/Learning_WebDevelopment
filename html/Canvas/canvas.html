<!doctype html>
<html>
  <body>
    <p>Image to use:</p>
    <img
      id="scream"
      src="../../img/first_fragrance.jpg"
      alt="The Scream"
      width="220"
      height="277"
    />

    <p>Canvas to fill:</p>
    <canvas
      id="myCanvas"
      width="250"
      height="300"
      style="border: 1px solid #d3d3d3"
    >
      Your browser does not support the HTML canvas tag.</canvas
    >

    <p><button onclick="myCanvas()">Try it</button></p>

    <script>
      function myCanvas() {
        let c = document.getElementById("myCanvas");
        let ctx = c.getContext("2d");
        let img = document.getElementById("scream");
        ctx.drawImage(img, 15, 11, 220, 277);
      }
    </script>
  </body>
</html>
